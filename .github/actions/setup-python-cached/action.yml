name: Set up Python with a cached toolchain
description: >-
  Installs the exact Python version named in the repo-root .python-version file,
  or in .python-version-macos on a macOS runner: CPython 3.12.11 and later are
  source-only releases with no macOS build in actions/python-versions, and
  ubuntu-latest (26.04) has builds only from 3.12.13.
  The toolchain directory for that version is restored from and saved to the runner
  tool cache, so a warm run skips the download. On a miss, actions/setup-python runs
  up to three times with backoff so a transient 403 or 504 does not fail the job.
  Callers must check out the repository first.
runs:
  using: composite
  steps:
    - id: version
      shell: bash
      run: |
        set -euo pipefail
        file=.python-version
        if [[ "$RUNNER_OS" == macOS ]]; then
          file=.python-version-macos
        fi
        v=$(tr -d '[:space:]' < "$file")
        if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "$file: expected x.y.z (got '$v')" >&2
          exit 1
        fi
        echo "version=$v" >> "$GITHUB_OUTPUT"

    # Restore first so setup-python finds the toolchain in the tool cache. The
    # post step saves the directory only after a miss.
    - id: toolchain-cache
      uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        path: ${{ runner.tool_cache }}/Python/${{ steps.version.outputs.version }}
        key: setup-python-toolchain-${{ runner.os }}-${{ runner.arch }}-py${{ steps.version.outputs.version }}

    - id: setup-python-1
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      continue-on-error: true
      with:
        python-version: ${{ steps.version.outputs.version }}

    - name: Back off before setup-python attempt 2
      if: steps.setup-python-1.outcome == 'failure'
      shell: bash
      run: |
        echo "setup-python attempt 1 failed; retrying in 30s" >&2
        sleep 30

    - id: setup-python-2
      if: steps.setup-python-1.outcome == 'failure'
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      continue-on-error: true
      with:
        python-version: ${{ steps.version.outputs.version }}

    - name: Back off before setup-python attempt 3
      if: steps.setup-python-1.outcome == 'failure' && steps.setup-python-2.outcome == 'failure'
      shell: bash
      run: |
        echo "setup-python attempt 2 failed; retrying in 90s" >&2
        sleep 90

    - id: setup-python-3
      if: steps.setup-python-1.outcome == 'failure' && steps.setup-python-2.outcome == 'failure'
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: ${{ steps.version.outputs.version }}
