name: Post CI
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  contracts:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PANEWIRE_POST_LINUX_RUNNER) || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tests and moved contracts
        run: bash tests/run-all.sh
  post-ok:
    if: ${{ github.ref == 'refs/heads/main' && always() && (contains(needs.*.result, 'failure') || !contains(needs.*.result, 'cancelled')) }}
    needs: [contracts]
    runs-on: ubuntu-latest
    steps:
      - run: test '${{ needs.contracts.result }}' = success
