name: CI (any ref)
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Exact 40-hex commit SHA to test
        required: true
        type: string
      suite:
        description: Which tier to run
        required: false
        type: choice
        default: main
        options:
          - main
          - deploy
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - env:
          TARGET_SHA: ${{ inputs.ref }}
          DISPATCH_REF: ${{ github.ref }}
        run: |
          [[ "$TARGET_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          # Post CI jobs are gated to refs/heads/main; elsewhere they would skip and look green.
          [[ "$DISPATCH_REF" == refs/heads/main ]]
  ci:
    if: ${{ inputs.suite == 'main' }}
    needs: validate
    concurrency:
      group: ci-any-ref-ci-${{ inputs.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    uses: ./.github/workflows/post-ci.yml
    with:
      ref: ${{ inputs.ref }}
  deploy:
    if: ${{ inputs.suite == 'deploy' }}
    needs: validate
    # deploy.yml's deploy-ok job needs the commit-status scope; a called workflow can
    # only receive permissions this job grants.
    permissions:
      contents: read
      statuses: write
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ inputs.ref }}
  status:
    if: ${{ always() && needs.validate.result == 'success' }}
    needs: [validate, ci, deploy]
    runs-on: ubuntu-latest
    concurrency:
      group: ci-any-ref-status-${{ inputs.ref }}
      cancel-in-progress: true
    permissions:
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: ${{ inputs.ref }}
      SUITE: ${{ inputs.suite }}
      MAIN_RESULT: ${{ needs.ci.result }}
      DEPLOY_RESULT: ${{ needs.deploy.result }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - run: |
          if [[ "$SUITE" == deploy ]]; then
            RESULT="$DEPLOY_RESULT"
          else
            RESULT="$MAIN_RESULT"
          fi
          # A cancelled or skipped tier has no verdict; post nothing.
          case "$RESULT" in
            success) STATE=success ;;
            cancelled|skipped) echo "$SUITE: $RESULT, no status posted"; exit 0 ;;
            *) STATE=failure ;;
          esac
          if [[ "$SUITE" == deploy ]]; then
            gh api "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
              -f state="$STATE" -f context=deploy-ok -f target_url="$RUN_URL" \
              -f description="exact-head deploy: $RESULT"
          else
            gh api "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
              -f state="$STATE" -f context=post-ok -f target_url="$RUN_URL" \
              -f description="exact-head CI: $RESULT"
          fi
