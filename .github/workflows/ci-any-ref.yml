name: CI (any ref)
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Exact 40-hex commit SHA to test
        required: true
        type: string
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - env:
          TARGET_SHA: ${{ inputs.ref }}
          DISPATCH_REF: ${{ github.ref }}
        run: |
          [[ "$TARGET_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          # Post CI jobs are gated to refs/heads/main; elsewhere they would skip and look green.
          [[ "$DISPATCH_REF" == refs/heads/main ]]
  ci:
    needs: validate
    concurrency:
      group: ci-any-ref-ci-${{ inputs.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    uses: ./.github/workflows/post-ci.yml
    with:
      ref: ${{ inputs.ref }}
  status:
    if: ${{ always() && needs.validate.result == 'success' && needs.ci.result != 'cancelled' }}
    needs: [validate, ci]
    runs-on: ubuntu-latest
    concurrency:
      group: ci-any-ref-status-${{ inputs.ref }}
      cancel-in-progress: true
    permissions:
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: ${{ inputs.ref }}
      RESULT: ${{ needs.ci.result }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - run: |
          case "$RESULT" in
            success) STATE=success ;;
            *) STATE=failure ;;
          esac
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            -f state="$STATE" -f context=post-ok -f target_url="$RUN_URL" \
            -f description="exact-head CI: $RESULT"
