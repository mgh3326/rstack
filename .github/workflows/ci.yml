name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tests and moved contracts
        run: |
          python3 tests/test-install.py
          python3 tests/test-adapter.py
          python3 tests/test-fleet-install-review.py
          python3 tests/test-fleet-install-concurrent.py
          for test in tests/test-*.sh; do bash "$test"; done
  ci-ok:
    if: always()
    needs: contracts
    runs-on: ubuntu-latest
    steps:
      - run: test '${{ needs.contracts.result }}' = success
