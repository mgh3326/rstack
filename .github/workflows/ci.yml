name: CI
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-cached
      - name: Install tests and moved contracts
        run: bash tests/run-all.sh
  ci-ok:
    if: ${{ always() && (contains(needs.*.result, 'failure') || !contains(needs.*.result, 'cancelled')) }}
    needs: contracts
    runs-on: ubuntu-latest
    steps:
      - run: test '${{ needs.contracts.result }}' = success
